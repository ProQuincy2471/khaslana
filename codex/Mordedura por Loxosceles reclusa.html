:root{
 --sans:'Source Sans 3',system-ui,sans-serif;
 --serif:'Newsreader',Georgia,'Times New Roman',serif;
 --paper:#FAF9F7;--ink:#1C1C1A;--soft:#6B6B66;--rule:#E4E2DD;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--serif);background:var(--paper);color:var(--ink);}
.shell{display:flex;align-items:flex-start;gap:30px;max-width:1200px;margin:0 auto;padding:26px 22px;}

/* INDICE */
.toc{position:sticky;top:26px;width:158px;flex-shrink:0;font-family:var(--sans);max-height:calc(100vh - 52px);overflow-y:auto;padding-right:6px;}
.toc h2{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#B5B3AC;margin:0 0 8px 2px;font-family:var(--sans);font-weight:700;}
.toc a{display:flex;gap:6px;align-items:baseline;font-size:10px;font-weight:500;color:#7A7973;text-decoration:none;padding:2.5px 5px;border-radius:4px;line-height:1.3;border-left:2px solid transparent;}
.toc a>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.toc a:hover{background:#F0EEE9;}
.toc a.on{border-left-color:currentColor;background:#F0EEE9;font-weight:700;}
.toc a .n{font-size:8px;font-weight:700;letter-spacing:.03em;opacity:.85;flex-shrink:0;width:24px;}
.toc-tools{margin-top:12px;padding-top:11px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:5px;}
.tbtn{font-family:var(--sans);font-size:9.5px;font-weight:600;padding:5px 7px;border-radius:5px;border:1px solid var(--rule);background:transparent;color:#57564F;cursor:pointer;text-align:left;}
.tbtn:hover{background:#F0EEE9;}
.tbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
#design label{display:block;font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);margin-bottom:7px;}
#design select{display:block;width:100%;margin-top:3px;font-family:var(--sans);font-size:10.5px;font-weight:600;padding:4px 5px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:#3A3A36;text-transform:none;letter-spacing:0;}
#design label{display:flex;flex-direction:column;gap:3px;font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);}
#design select{font-family:var(--sans);font-size:10.5px;padding:4px 5px;border:1px solid var(--rule);border-radius:5px;background:#fff;color:#333;}
#cfg-out{font-family:var(--sans);font-size:8.5px;color:#B5B3AC;word-break:break-all;line-height:1.5;margin-top:4px;}

/* PAGINA */
.main{flex:1;min-width:0;max-width:860px;background:#fff;border:1px solid var(--rule);border-radius:3px;padding:46px 44px 40px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
h1.main-title{font-family:var(--serif);font-size:29px;font-weight:600;letter-spacing:-.4px;line-height:1.2;}
p.subtitle{font-family:var(--sans);font-size:10.5px;color:var(--soft);font-weight:500;letter-spacing:.02em;margin:9px 0 0;padding-bottom:22px;border-bottom:1px solid var(--rule);}

/* PROSA — el tejido conectivo */
.prose{font-size:15.5px;line-height:1.75;color:#2A2A27;max-width:68ch;margin:24px 0;}
.prose strong,.cap strong{font-weight:700;color:#12110F;}
.prose mark,.cap mark{background:none;color:inherit;font-weight:600;box-shadow:inset 0 -0.42em 0 rgba(0,0,0,.055);padding:0 .06em;}
.prose+.prose{margin-top:-8px;}

/* INTRO — parrafo editorial antes de un bloque estructurado */
.blk-intro{font-family:var(--serif);font-size:13.5px;line-height:1.6;color:#45443F;max-width:68ch;margin:0 0 13px;}
.blk-intro strong{font-weight:700;color:#12110F;}
.blk-intro mark{background:none;color:inherit;font-weight:600;box-shadow:inset 0 -0.42em 0 rgba(0,0,0,.055);padding:0 .06em;}

/* FIGURA */
.part{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.2px;margin:44px 0 4px;padding-top:20px;border-top:2px solid var(--ink);display:flex;align-items:baseline;gap:11px;}
.part .pn{font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--soft);}
.part:first-of-type{margin-top:14px;}
.toc .ph{font-family:var(--sans);font-size:8.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ink);margin:11px 0 4px 5px;line-height:1.25;}
.toc .ph:first-child{margin-top:0;}
.blk{margin:26px 0;border-radius:6px;border-left:3px solid currentColor;padding:0 14px 14px;}
.blk-head{display:flex;align-items:center;gap:10px;font-family:var(--sans);cursor:pointer;user-select:none;padding:14px 0 11px;border-bottom:2px solid currentColor;}
.blk-head .num{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;flex-shrink:0;color:#fff;padding:3px 7px;border-radius:3px;}
.blk-head .htxt{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;flex:1;}
.blk-head .chev{font-size:9px;color:#B5B3AC;transition:transform .15s;}
.blk.closed .chev{transform:rotate(-90deg);}
.blk.closed .blk-body,.blk.closed .cap{display:none;}
.blk-body{padding:16px 0 0;}
.dl{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:4px;border:1px solid var(--rule);cursor:pointer;background:transparent;color:#8A8880;}
.dl:hover{border-color:#B5B3AC;color:var(--ink);}
.cap{font-size:12.5px;line-height:1.55;color:var(--soft);font-style:italic;margin-top:11px;padding-left:2px;max-width:70ch;}

/* NODOS — reservado para casos-excepcion (variante D, "cards") */
.grid{display:grid;gap:10px;}
.node{font-family:var(--sans);font-size:11.5px;line-height:1.45;word-break:break-word;height:auto;min-height:34px;padding:11px 14px;border-radius:5px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:3px;background:#fff;border:1px solid var(--rule);border-left:3px solid currentColor;}
/* relation (metadato neutral del bloque: "En orden", "A la vez"...) */
.relnote{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid currentColor;white-space:nowrap;}
.node{position:relative;}
.stepno{position:absolute;top:-8px;left:-8px;width:19px;height:19px;border-radius:50%;font-family:var(--sans);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 0 2px #fff;}
.node.key .stepno{box-shadow:0 0 0 2px currentColor;}
.altno{position:absolute;top:-8px;left:-8px;padding:1px 7px;border-radius:9px;font-family:var(--sans);font-size:9px;font-weight:800;letter-spacing:.06em;color:#fff;box-shadow:0 0 0 2px #fff;}
/* when: condicion contextual que activa la tarjeta */
.whentag{font-family:var(--serif);font-size:9.5px;font-weight:600;letter-spacing:0;font-style:italic;opacity:.8;display:block;margin-bottom:2px;}
.seqgrid{position:relative;}
/* group: etiqueta de categoria (comparar entidades) */
.gtag{font-family:var(--sans);font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1.5px 6px;border-radius:3px;color:#fff;display:inline-block;}
.node .gtag{margin-bottom:2px;}
.kv-item .gtag{margin-bottom:4px;}
.node .t{font-size:13.5px;font-weight:700;}
.node .d{font-size:11.5px;font-weight:400;color:#54534E;}
/* key: prioridad clinica/ENARM — acento discreto, no relleno solido salvo variante cards */
.node.key{border-left-width:4px;background:rgba(0,0,0,.015);}
.keytag{font-family:var(--sans);font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85;display:block;margin-bottom:3px;}
.arrow{font-family:var(--sans);text-align:center;font-size:13px;color:#C4C2BA;line-height:1;margin:4px 0;}
.arrow .lb{display:block;font-size:10px;font-weight:600;margin-top:2px;font-style:italic;font-family:var(--serif);}

/* LISTA EDITORIAL — variante A, default de "nodes": sin caja, whitespace + regla fina */
.elist{display:grid;gap:0;}
.elist.c2{grid-template-columns:1fr 1fr;column-gap:30px;}
.eitem{padding:10px 0;border-bottom:1px solid var(--rule);}
.eitem:last-child{border-bottom:none;}
.eitem .emark{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 8px 1px 0;vertical-align:middle;flex-shrink:0;}
.eitem-h{display:flex;align-items:baseline;}
.eitem .et{font-family:var(--sans);font-size:13px;font-weight:700;color:#2A2A27;}
.eitem .ed{display:block;font-size:12px;color:#54534E;line-height:1.5;margin-top:2px;padding-left:14px;}
.eitem.key{border-left:3px solid currentColor;padding-left:10px;background:rgba(0,0,0,.015);border-bottom:1px solid var(--rule);}
.eitem .whentag{padding-left:14px;}

/* CHECKLIST — variante B: marcador de verificacion, no tarjeta */
.clist{display:grid;gap:0;}
.clist.c2{grid-template-columns:1fr 1fr;column-gap:30px;}
.citem{display:flex;gap:9px;align-items:flex-start;padding:7px 0;}
.cbox{width:12px;height:12px;border:1.5px solid currentColor;border-radius:3px;flex-shrink:0;margin-top:3px;}
.citem .ct{font-size:12.5px;line-height:1.5;color:#2A2A27;}
.citem .ct .ck{font-weight:700;}
.citem.key .ct{font-weight:700;}

/* METRIC-LIST — variante C: nombre / cifra comparable, alineado */
.mlist{display:grid;grid-template-columns:1fr auto;column-gap:18px;row-gap:0;}
.mlist.c2{grid-template-columns:1fr auto 1fr auto;}
.mname{font-family:var(--sans);font-size:12.5px;color:#3A3A36;padding:7px 0;border-bottom:1px solid var(--rule);align-self:center;}
.mval{font-family:var(--sans);font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;padding:7px 0;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap;align-self:center;}

/* HERO METRIC — excepcion para 1-3 cifras extraordinariamente memorables */
.hero{display:flex;gap:26px;flex-wrap:wrap;}
.hero-item{text-align:left;}
.hero-item .hv{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;}
.hero-item .hk{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-top:5px;}

/* STEPPER — flow: timeline vertical editorial, sin caja por paso */
.stepper{position:relative;}
.stepper-line{position:absolute;left:13px;top:13px;bottom:13px;width:2px;background:var(--rule);}
.step-row{display:flex;gap:14px;position:relative;}
.step-num{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:800;font-size:12px;color:#fff;position:relative;z-index:1;}
.step-content{flex:1;padding-bottom:20px;}
.step-content .st{font-family:var(--sans);font-size:13.5px;font-weight:700;color:#2A2A27;}
.step-content .sd{font-size:12.5px;color:#54534E;line-height:1.55;margin-top:3px;}
.step-row.key .step-content{border-left:3px solid currentColor;padding-left:10px;margin-left:-10px;}
.step-row.key .st{color:inherit;}
.step-cond{margin:-8px 0 14px 40px;font-family:var(--serif);font-size:12px;font-style:italic;color:#8A8880;line-height:1.5;}

/* BRANCH — arbol de decision editorial, sin cards internas */
.branch-crit{font-family:var(--serif);font-size:15.5px;font-weight:600;color:#1C1C1A;padding-bottom:10px;margin-bottom:16px;border-bottom:2px solid currentColor;}
.branch-cols{display:grid;gap:22px;}
.branch-col{border-top:3px solid currentColor;padding-top:10px;}
.branch-label{font-family:var(--sans);font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:9px;}

/* PANEL SECTION — columnas editoriales, no cajas dentro de cajas */
.psec-h{font-family:var(--sans);font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding-bottom:7px;margin-bottom:10px;border-bottom:2px solid currentColor;}

/* CUADRO DE DATOS — data sheet / definition list, sin caja por pareja */
.kv{display:block;}
.kv-item{padding:8px 0;border-bottom:1px solid var(--rule);}
.kv-item:last-child{border-bottom:none;}
.kv-item.row{display:flex;justify-content:space-between;align-items:baseline;gap:18px;}
.kv-item .k{display:block;font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:2px;flex-shrink:0;}
.kv-item.row .k{margin-bottom:0;padding-top:1px;}
.kv-item .v{display:block;font-family:var(--sans);font-size:13px;font-weight:700;line-height:1.4;text-align:left;color:#2A2A27;}
.kv-item.row .v{text-align:right;flex-shrink:0;}
.kv-item.key{border-left:3px solid currentColor;padding-left:10px;margin-left:-10px;background:rgba(0,0,0,.015);}

/* NOTA */
.callout{font-size:13.5px;line-height:1.6;padding:11px 14px;margin-bottom:10px;border-left:4px solid currentColor;border-radius:0 5px 5px 0;}
.callout .ic{font-size:11px;font-family:var(--sans);font-weight:800;letter-spacing:.09em;text-transform:uppercase;display:block;margin-bottom:3px;}
.callout .cx{color:#2A2A27;}

/* TABLA */
.figbox{text-align:center;}
.figbox img{max-width:100%;height:auto;border:1px solid var(--rule);border-radius:5px;background:#fff;}
.credit{font-family:var(--sans);font-size:8.5px;color:#9A9992;margin-top:6px;letter-spacing:.03em;}
.blk>.credit{border-top:1px dotted var(--rule);padding-top:6px;font-style:normal;}
.srcline{font-family:var(--sans);font-size:8.5px;font-weight:600;letter-spacing:.04em;color:#9A9992;margin-top:6px;}
.srcline b{font-weight:800;color:#7A7973;}
.reflist{margin-top:30px;padding-top:14px;border-top:1px solid var(--rule);}
.reflist h3{font-family:var(--sans);font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--soft);margin-bottom:8px;}
.reflist li{font-size:12px;line-height:1.55;color:#45443F;margin-bottom:5px;list-style:none;}
.reflist li b{font-family:var(--sans);font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-right:6px;}
.tw{overflow-x:auto;}
table.cmp{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:11.5px;background:#fff;}
table.cmp th{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:8px 10px;text-align:left;}
table.cmp td{border-bottom:1px solid var(--rule);padding:8px 10px;vertical-align:top;line-height:1.5;color:#2A2A27;}
table.cmp td:first-child{font-weight:700;}
table.cmp tr:nth-child(odd) td{background:rgba(0,0,0,.014);}
table.cmp td.entity-alt{background:rgba(0,0,0,.022);}
table.cmp tr:nth-child(odd) td.entity-alt{background:rgba(0,0,0,.032);}

/* PANELES — secciones editoriales, no cajas dentro de cajas */
.panels{display:grid;gap:24px;}
.panel{padding:0;}

/* SIMULACRO */
.case-stem{font-size:14px;line-height:1.62;color:#2A2A27;margin-bottom:10px;}
.caseq{border-left:3px solid;background:#fff;border-radius:0 5px 5px 0;padding:11px 13px;margin-bottom:10px;}
.caseq .qt{font-family:var(--sans);font-size:12.5px;font-weight:800;line-height:1.4;margin-bottom:8px;}
.opts{display:grid;gap:5px;margin-bottom:9px;}
.opt{display:flex;gap:8px;align-items:flex-start;font-family:var(--sans);font-size:12px;line-height:1.45;color:#2A2A27;padding:5px 7px;border:1px solid transparent;border-radius:4px;}
.opt .ol{font-weight:800;font-size:10px;border:1px solid;border-radius:3px;padding:1px 5px;flex-shrink:0;margin-top:1px;}
.ansbtn{font-family:var(--sans);font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;background:#fff;border:1px solid;border-radius:4px;padding:4px 9px;cursor:pointer;}
.ans{margin-top:8px;padding:9px 11px;border-radius:5px;}
.ans .anskey{font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;}
.ans .answhy{font-size:13px;line-height:1.55;color:#2A2A27;}
.ans .ansref{font-family:var(--sans);font-size:8.5px;color:#9A9992;margin-top:5px;font-style:italic;}

/* MODO ESTUDIO */
body.study .hid{cursor:pointer;position:relative;display:inline-block;min-width:76px;border-bottom:1px dashed #B5B3AC;background:#F4F2ED;border-radius:3px;}
body.study .hid>*{visibility:hidden;}
body.study .hid::after{content:attr(data-h);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8A8880;white-space:nowrap;padding:0 6px;}
body.study .hid.rev{background:none;border-bottom-color:transparent;}
body.study .hid.rev>*{visibility:visible;}
body.study .hid.rev::after{content:none;}
body.study .node .hid{min-width:64px;}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px;padding-top:14px;border-top:1px solid var(--rule);font-family:var(--sans);}
.legend-item{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:600;color:var(--soft);}
.legend-dot{width:9px;height:9px;border-radius:2px;}
.src-foot{margin-left:auto;font-size:9.5px;color:#B5B3AC;font-family:var(--serif);font-style:italic;}

"t":"Hábitat preferido","d":"Sitios tibios y secos: armarios, áticos y sótanos","_h":"detalle"}],"src_id":"prieto"},{"label":"fisiopatologia","title":"Fisiopatología","type":"prose","text":"El veneno de *Loxosceles* contiene enzimas dermonecróticas (esfingomielinasa D entre las mejor caracterizadas en la bibliografía general) que producen daño local progresivo del tejido, con isquemia y necrosis cutánea. En casos con toxicidad sistémica significativa (**loxoscelismo cutáneo-visceral**), el cuadro puede extenderse a hemólisis y a fenómenos de coagulación intravascular.","src_id":"prieto"},{"label":"clinica","title":"Evolución clínica de la mordedura","type":"flow","items":[{"t":"Mordedura inicial","d":"Suele ser indolora","_h":"manifestación"},{"arrow":"en las 6 horas siguientes"},{"t":"Manifestaciones locales tempranas","d":"Dolor, eritema y prurito locales; puede aparecer una flictena de coloración azul con halo eritematoso","_h":"manifestación"},{"arrow":"días siguientes"},{"t":"Evolución de la placa","d":"La mayoría se resuelven; algunas desarrollan escara necrótica central y ulceración","_h":"manifestación"},{"arrow":"2-3 días después de la mordedura"},{"t":"Manifestaciones sistémicas (loxoscelismo cutáneo-visceral)","d":"Síntomas gripales, artralgias, convulsiones y erupción cutánea; rara vez anemia hemolítica, CID, trombocitopenia, rabdomiólisis y daño renal agudo","_h":"manifestación"}],"src_id":"prieto"},{"label":"calculos","title":"Estudios en toxicidad sistémica","type":"keyvalue","items":[{"k":"Estudios a vigilar en loxoscelismo cutáneo-visceral","v":"Biometría hemática (anemia hemolítica), pruebas de coagulación (CID), CPK (rabdomiólisis) y función renal","_h":"valor de laboratorio"}],"src_id":"prieto"},{"label":"criterios","title":"Diferenciación clínica: cutáneo vs. cutáneo-visceral","type":"prose","text":"El diagnóstico es clínico y epidemiológico, sustentado en el antecedente de exposición en zonas tibias y secas y en la evolución característica de la lesión (mordedura indolora, flictena azulada con halo eritematoso, posible escara necrótica). ==La aparición de síntomas sistémicos 2-3 días después de la mordedura define el loxoscelismo cutáneo-visceral==, que requiere manejo más intensivo que la forma puramente cutánea.","src_id":"prieto"},{"label":"gravedad","title":"Manejo según forma clínica","type":"branch","criterion":"Presencia de toxicidad sistémica","branches":[{"label":"Loxoscelismo cutáneo","color":"sky","items":[{"t":"Manejo local","d":"Aseo local, elevación de la extremidad, analgésicos y profilaxis antitetánica si se considera necesaria","_h":"signo de alarma"}]},{"label":"Loxoscelismo cutáneo-visceral","color":"red","items":[{"t":"Manejo sistémico","d":"Se recomienda el uso de prednisona y dapsona; si se cuenta con el antídoto específico para el veneno de araña violinista, utilizarlo","_h":"signo de alarma"}]}],"src_id":"prieto"},{"label":"diagnosticos_diferenciales","title":"Diagnóstico diferencial de la lesión necrótica","type":"nodes","relation":"independiente","items":[{"t":"Mordedura por Latrodectus mactans","d":"Espasmo muscular y diaforesis sin lesión dermonecrótica local característica","_h":"hallazgo distintivo"},{"t":"Celulitis o fascitis necrosante infecciosa","d":"Sin antecedente de mordedura, con progresión sistémica más rápida y fiebre alta desde el inicio","_h":"hallazgo distintivo"},{"t":"Picadura de otros artrópodos","d":"Sin la flictena azulada con halo eritematoso ni la escara necrótica central característica","_h":"hallazgo distintivo"}],"src_id":"prieto"},{"label":"manejo","title":"Tratamiento","type":"nodes","relation":"independiente","items":[{"t":"Aseo local y elevación de la extremidad","d":"Medidas generales para todas las formas","_h":"tratamiento"},{"t":"Analgésicos","d":"Manejo del dolor local","_h":"tratamiento"},{"t":"Profilaxis antitetánica","d":"En caso de considerarse necesaria","_h":"tratamiento"},{"t":"Prednisona y dapsona","d":"En caso de toxicidad significativa (loxoscelismo cutáneo-visceral)","_h":"tratamiento"},{"t":"Antídoto específico","d":"Utilizar si se cuenta con antídoto específico para el veneno de araña violinista","_h":"tratamiento"}],"src_id":"prieto"},{"label":"complicaciones","title":"Complicaciones","type":"nodes","relation":"independiente","items":[{"t":"Escara necrótica y ulceración","d":"Complicación local más frecuente","_h":"complicación"},{"t":"Anemia hemolítica","d":"Rara, propia del loxoscelismo cutáneo-visceral","_h":"complicación"},{"t":"Coagulación intravascular diseminada","d":"Rara, en toxicidad sistémica","_h":"complicación"},{"t":"Rabdomiólisis y daño renal agudo","d":"Raros, en toxicidad sistémica","_h":"complicación"}],"src_id":"prieto"},{"label":"errores","title":"Perlas y errores frecuentes","type":"callout","items":[{"tag":"Trampa clásica","t":"Mordedura indolora","d":"La mordedura suele ser indolora al inicio; el dolor, eritema y prurito aparecen hasta 6 horas después","color":"amber"},{"tag":"Perla","t":"Ventana de alarma sistémica","d":"Las manifestaciones sistémicas suelen iniciar 2-3 días después de la mordedura, no de forma inmediata","color":"gold"},{"tag":"De elección","t":"Toxicidad significativa","d":"Prednisona y dapsona en el loxoscelismo cutáneo-visceral","color":"orange"}],"src_id":"prieto"}],"_accent":"medio"}</script>

function rich(host, txt){

// LENGUAJE VISUAL DE BLOQUES ESTRUCTURADOS

// estructura: lista editorial, checklist, metric-list o (excepcionalmente)
// cards. Ver "Seleccion del formato interno de nodes" en esquema.md.
// =====================================================================
var CHECKLIST_RX = /criterio|indicaci|referenc|vigilan|descartar|cumplir|comprobar|contraindicaci/i;
var METRIC_RX = /(\d+([.,]\d+)?\s*%|[≥≤<>]\s*\d|\braro\b|\bausente\b|\bpresente\b|\bno aplica\b|\bvariable\b)/i;

function classifyNodes(b){
  var items = (b.items || []).filter(function(it){ return !('arrow' in it); });
  var n = items.length;
  if(n === 0) return 'list';
  var title = (b.title || '') + ' ' + (b.label || '');
  if(CHECKLIST_RX.test(title)) return 'checklist';
  var withD = items.filter(function(it){ return it.d; });
  if(withD.length){
    var hits = withD.filter(function(it){ return METRIC_RX.test(it.d); }).length;
    if(n >= 3 && hits / withD.length >= 0.6) return 'metric';
  }
  var avg = items.reduce(function(s,it){ return s+itemLen(it); }, 0) / n;
  if(n <= 3 && avg > 140) return 'cards';
  return 'list';
}

// Distincion semantica: color solo donde de verdad marca una diferencia de

var SEM_RX = [
  [/contraindicad|no usar en|no administrar|evitar en|alto riesgo|riesgo alto|absolutamente/i, 'red'],
  [/\bgrave\b|sever[oa]|cr[ií]tico|urgente|emergencia|choque|falla (renal|card[ií]aca|hep[aá]tica)|mal pron[oó]stico/i, 'red'],
  [/moderad[oa]/i, 'amber'],
  [/\bleve\b|estable|bajo riesgo|de elecci[oó]n|primera l[ií]nea|primera intenci[oó]n|recomendado|preferid[oa]|buen pron[oó]stico/i, 'emerald'],

function semTone(text){

  return null;
}
function listColorFor(it, b, color){

// Columnas para list/checklist/metric: pocas, y el criterio es longitud real.
function listCols(items, kind, layout){
  var n = items.length;
  if(layout === 'stacked') return 1;
  if(kind === 'metric') return (layout === '2col' || n >= 10) ? 2 : 1;
  var avg = items.reduce(function(s,it){ return s+itemLen(it); }, 0) / Math.max(n,1);

    return avg <= 40 ? Math.min(3, n) : Math.min(2, n);
  }
  if(kind === 'checklist') return (n >= 6 && avg <= 70) ? 2 : 1;
  return (n >= 4 && avg <= 90) ? 2 : 1;

function nodesBody(b, color){

  if(kind === 'metric') return mlistEl(items, b, color, cols);

// BRANCH — arbol de decision: criterio + columnas de rama abiertas
function branchColsFor(b, branches){
  var n = branches.length;
  var lens = branches.map(function(br){ return (br.items||[]).reduce(function(s,it){ return s+itemLen(it); }, 0); });
  var avg = lens.reduce(function(a,x){ return a+x; }, 0) / Math.max(n,1);
  function auto(){
    if(n <= 2) return n || 1;
    if(avg <= 70) return Math.min(3, n);
    if(avg <= 200) return 2;
    return 1;
  }
  if(b.layout === 'stacked') return 1;
  if(b.layout === '2col') return Math.min(2, n);

      box.style.color = tone(c,'base'); box.style.background = tone(c,'pastel');
      box.appendChild(el('span','ic', tag));
      box.appendChild(el('span','cx', cap(it.t) + (it.d ? ' ' + cap(it.d) : '')));
      w.appendChild(box);
    });
    return w;
  },

  'case': function(b){
    var w = el('div'), fam = famOf(b);
    if(b.stem) w.appendChild(rich(el('div','case-stem'), b.stem));
    (b.questions||[]).forEach(function(q, qi){
      var box = el('div','caseq');
      box.style.borderLeftColor = tone(fam,'base');
      if(q.stem) box.appendChild(rich(el('div','case-stem'), q.stem));
      var qt = el('div','qt', (qi+1) + '. ' + (q.q||''));
      qt.style.color = tone(fam,'dark'); box.appendChild(qt);

      // Aleatoriza el orden de las opciones (semilla estable por pregunta,
      // asi no cambia entre recargas) para que la letra correcta no quede
      // siempre en la misma posicion en todo el simulacro.
      var origOptions = q.options || [];
      var order = origOptions.map(function(_, i){ return i; });
      order = shuffleSeeded(order, (b.title||'') + '|' + qi + '|' + (q.q||''));
      var origCorrectIdx = String(q.answer||'').trim().toUpperCase().charCodeAt(0) - 65;
      var newCorrectIdx = order.indexOf(origCorrectIdx);
      var answerKey = newCorrectIdx >= 0 ? String.fromCharCode(65+newCorrectIdx) : String(q.answer||'');

      var ol = el('div','opts');
      order.forEach(function(origIdx, oi){
        var L = String.fromCharCode(65+oi), row = el('div','opt');
        var k = el('span','ol', L);
        k.style.color = tone(fam,'dark'); k.style.borderColor = tone(fam,'light');
        row.appendChild(k); row.appendChild(el('span','ox', origOptions[origIdx]));
        row.setAttribute('data-opt', L);
        ol.appendChild(row);
      });
      box.appendChild(ol);

      var btn = el('button','ansbtn','Ver respuesta');
      btn.style.color = tone(fam,'dark'); btn.style.borderColor = tone(fam,'light');
      var ans = el('div','ans');
      ans.style.display = 'none';
      ans.style.background = tone('emerald','pastel');
      ans.appendChild(el('div','anskey','Respuesta: ' + answerKey))
         .style.color = tone('emerald','dark');
      if(q.why) ans.appendChild(rich(el('div','answhy'), q.why));
      if(q.ref) ans.appendChild(el('div','ansref', q.ref));

      btn.onclick = function(e){
        e.stopPropagation();
        var on = ans.style.display === 'none';
        ans.style.display = on ? 'block' : 'none';
        btn.textContent = on ? 'Ocultar respuesta' : 'Ver respuesta';
        Array.prototype.forEach.call(ol.children, function(r){
          var hit = on && r.getAttribute('data-opt') === answerKey;
          r.style.background = hit ? tone('emerald','pastel') : '';
          r.style.borderColor = hit ? tone('emerald','light') : 'transparent';
        });
      };
      box.appendChild(btn); box.appendChild(ans);
      w.appendChild(box);
    });
    return w;
  }
};

function render(){
  var main = document.getElementById('main'), toc = document.getElementById('toc-list');
  main.innerHTML = ''; toc.innerHTML = '';
  main.appendChild(el('h1','main-title', D.title||D.topic));
  main.appendChild(el('p','subtitle', D.subtitle||''));

  var n = {}, ids = [], curPart = null, ROM = ['I','II','III','IV','V','VI','VII','VIII'], pi = 0;
  var lastPart = null;
  D.blocks.forEach(function(b,i){
    if(b.part) lastPart = b.part; else b.part = lastPart;
    if(!b.src_id && D.src) b.src_id = D.src;
    if(b.part && b.part !== curPart){
      curPart = b.part; pi++;
      var ph = el('div','part');
      ph.appendChild(el('span','pn','Parte ' + (ROM[pi-1] || pi)));
      ph.appendChild(el('span','', b.part));
      main.appendChild(ph);
      ids.push({part: b.part});
    }
    if(b.type === 'prose'){ main.appendChild(R.prose(b)); return; }
    var c = famOf(b), id='b'+i, kind = KIND[b.type]||'Figura';
    n[kind] = (n[kind] || 0) + 1;
    var tag = kind + ' ' + n[kind];
    ids.push({id:id, tag:tag, title:b.title||b.label, color:c});

    var box = el('div','blk'); box.id = id;
    box.style.color = tone(c,'light'); box.style.background = tone(c,'pastel')+BLKA();
    box.style.borderLeftColor = tone(c,'base');
    var head = el('div','blk-head'); head.style.borderBottomColor = tone(c,'base');
    var num = el('span','num', tag);
    var ht = el('span','htxt', b.title||b.label);
    if(A() === 'fuerte'){
      head.style.background = tone(c,'base'); head.style.margin = '0 -16px'; head.style.padding = '11px 16px';
      head.style.borderRadius = '0 5px 0 0'; head.style.borderBottom = 'none';
      num.style.background = 'rgba(255,255,255,.9)'; num.style.color = tone(c,'dark');
      ht.style.color = tone(c,'onBase');
    } else {
      num.style.background = tone(c,'base'); num.style.color = tone(c,'onBase');
      ht.style.color = tone(c,'dark');
    }
    head.appendChild(num); head.appendChild(ht);
    if(b.relation && b.relation !== 'independiente' && REL[b.relation]){
      var rn = el('span','relnote', REL[b.relation].label);
      rn.style.color = tone(c,'dark'); rn.title = REL[b.relation].hint;
      head.appendChild(rn);
    }
    var dl = el('button','dl','PNG');
    dl.onclick = function(e){ e.stopPropagation(); shoot(box, b.label||'figura', dl); };
    head.appendChild(dl);
    head.appendChild(el('span','chev','▾'));
    head.onclick = function(){ box.classList.toggle('closed'); };
    box.appendChild(head);

    var body = el('div','blk-body');
    try { body.appendChild((R[b.type]||R.nodes)(b, c)); }
    catch(err){ body.appendChild(el('div','prose','Bloque no renderizable: '+err.message)); }
    box.appendChild(body);
    if(b.src_id && !(b.origin === 'propia'))
      box.appendChild(rich(el('div','srcline'), '**Fuente:** ' + srcLabel(b.src_id)));
    if(b.origin === 'propia' && b.based_on)
      box.appendChild(el('div','credit', 'Elaboración editorial propia basada en ' + b.based_on));
    if(b.caption) box.appendChild(rich(el('div','cap'), b.caption));
    main.appendChild(box);
  });

  ids.forEach(function(x){
    if(x.part){ toc.appendChild(el('div','ph', x.part)); return; }
    var a = el('a'); a.href='#'+x.id; a.style.color = tone(x.color,'base');
    a.appendChild(el('span','n', x.tag));
    var t = el('span','', x.title); t.style.color='#57564F'; a.appendChild(t);
    toc.appendChild(a);
  });

  if((D.sources || []).length){
    var rl = el('div','reflist');
    rl.appendChild(el('h3','','Fuentes del capítulo'));
    var ul = document.createElement('ul');
    D.sources.forEach(function(s){
      var li = document.createElement('li');
      li.appendChild(el('b','', s.short || s.id));
      li.appendChild(document.createTextNode(s.cite || ''));
      ul.appendChild(li);
    });
    rl.appendChild(ul); main.appendChild(rl);
  }

  var lg = el('div','legend');
  (D.legend||[]).forEach(function(l){
    var it = el('div','legend-item'), d = el('span','legend-dot');
    d.style.background = tone(l.color,'base');
    it.appendChild(d); it.appendChild(el('span','', l.text)); lg.appendChild(it);
  });
  lg.appendChild(el('div','src-foot', (D.source ? D.source+' · ' : '')+'2026-08-22'));
  main.appendChild(lg);

  document.addEventListener('click', function(e){
    if(!document.body.classList.contains('study')) return;
    var h = e.target.closest('.hid'); if(h) h.classList.toggle('rev');
  });
  try { spy(toc, ids.filter(function(x){ return x.id; }).map(function(x){ return x.id; })); } catch(e){}
}

function spy(toc, boxIds){
  var links = Array.prototype.slice.call(toc.querySelectorAll('a'));
  var boxes = boxIds.map(function(id){ return document.getElementById(id); });
  var obs = new IntersectionObserver(function(en){
    en.forEach(function(x){
      if(!x.isIntersecting) return;
      links.forEach(function(l){ l.classList.remove('on'); });
      var i = boxes.indexOf(x.target); if(i>-1) links[i].classList.add('on');
    });
  }, {rootMargin:'-12% 0px -70% 0px'});
  boxes.forEach(function(b){ obs.observe(b); });
}

function hideUI(h){ document.querySelectorAll('.dl,.chev').forEach(function(b){ b.style.visibility = h?'hidden':''; }); }
function shoot(node, name, btn){
  var was = node.classList.contains('closed'); if(was) node.classList.remove('closed');
  var orig = btn?btn.textContent:null; if(btn){ btn.textContent='…'; btn.disabled=true; }
  hideUI(true);
  html2canvas(node, {scale:3, backgroundColor:'#ffffff', logging:false})
    .then(function(cv){ cv.toBlob(function(bl){
      var u = URL.createObjectURL(bl), a = document.createElement('a');
      a.download = D.topic+' — '+name+'.png'; a.href = u;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); }, 400);
    },'image/png'); })
    .catch(function(e){ alert('Error al exportar: '+e); })
    .then(function(){ hideUI(false); if(was) node.classList.add('closed'); if(btn){ btn.textContent=orig; btn.disabled=false; } });
}

render();
document.getElementById('b-study').onclick = function(e){
  document.body.classList.toggle('study');
  e.target.classList.toggle('on');
  document.querySelectorAll('.hid.rev').forEach(function(h){ h.classList.remove('rev'); });
};
document.getElementById('b-fold').onclick = function(e){
  var any = Array.prototype.slice.call(document.querySelectorAll('.blk')).some(function(b){ return !b.classList.contains('closed'); });
  document.querySelectorAll('.blk').forEach(function(b){ b.classList.toggle('closed', any); });
  e.target.textContent = any ? 'Desplegar figuras' : 'Plegar figuras';
};
document.getElementById('b-png').onclick = function(e){ shoot(document.getElementById('main'), 'completo', e.target); };

// --- ajuste de diseño en vivo -------------------------------------------
var SEL = {pal:'s-pal', vari:'s-var', acc:'s-acc'};
Object.keys(SEL).forEach(function(k){
  var s = document.getElementById(SEL[k]);
  s.value = cfg[k];
  s.onchange = function(){ cfg[k] = s.value; render(); echoCfg(); };
});
function echoCfg(){
  document.getElementById('cfg-out').textContent =
    'build.py tema.json --tono ' + cfg.pal + ' --paleta ' + cfg.vari +
    ' --accent ' + cfg.acc;
}
document.getElementById('b-design').onclick = function(e){
  var d = document.getElementById('design'), on = d.style.display === 'none';
  d.style.display = on ? 'flex' : 'none';
  e.target.classList.toggle('on', on);
  if(on) echoCfg();
};
</script>
